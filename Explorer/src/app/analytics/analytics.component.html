<div>
  <h2>Analytics Dashboard</h2>

  <div>
    <h3>Statistics</h3>
    <p>Posts: {{ postCount }}</p>
    <p>Comments: {{ commentCount }}</p>
  </div>

  <div>
    <h3>Users</h3>
    <p>Total Users: {{ totalUsers }}</p>
    <p>Users with Posts: {{ usersWithPosts }}</p>
    <p>Users with Comments: {{ usersWithComments }}</p>
    <p>Inactive Users: {{ inactiveUsers }}</p>
  </div>

  <div>
    <h3>Activity Distribution</h3>
    <canvas baseChart
            [data]="pieChartData"
            [options]="pieChartOptions"
            chartType="pie">
    </canvas>
  </div>
</div>
